<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Facturas — GPN Portal Facturas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .factura-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid #f0f4ec; transition: background 0.15s; }
    .factura-row:last-child { border-bottom: none; }
    .factura-row:hover { background: #fafcf8; }
    .factura-main { flex: 1; min-width: 0; }
    .factura-name { font-weight: 600; font-size: 0.9rem; color: var(--text); margin-bottom: 3px; }
    .factura-meta { font-size: 0.78rem; color: var(--text-muted); }
    .factura-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .facturas-card { background: white; border-radius: var(--card-radius); box-shadow: var(--shadow); overflow: hidden; }
    .facturas-card-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 16px; border-bottom: 1px solid #f0f4ec; }

    .btn-xml {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: 9px; font-size: 0.78rem; font-weight: 600;
      text-decoration: none; transition: all 0.18s; border: 1.5px solid;
      background: #e8f0fe; color: #1a6ae0; border-color: #c2d4f8;
    }
    .btn-xml:hover { background: #d0e4fd; }

    .btn-pdf {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: 9px; font-size: 0.78rem; font-weight: 600;
      text-decoration: none; transition: all 0.18s; border: 1.5px solid;
      background: #fef0ef; color: var(--error); border-color: #fad7d5;
    }
    .btn-pdf:hover { background: #fad7d5; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/dashboard" class="nav-brand">
      <div class="nav-brand-icon">🎨</div>
      <div>
        <div class="nav-brand-name">GPN</div>
        <div class="nav-brand-sub">Pinturas y Recubrimientos</div>
      </div>
    </a>
    <div class="nav-links">
      <a href="/dashboard" class="nav-link">Inicio</a>
      <a href="/mis-tickets" class="nav-link">Mis Tickets</a>
      <a href="/mis-facturas" class="nav-link active">Mis Facturas</a>
      <a href="/perfil" class="nav-link">Mi Perfil</a>
      <a href="/admin-residentes" class="nav-link" id="nav-admin" style="display:none;">Admin</a>
    </div>
    <div class="nav-right">
      <div class="residente-selector" id="residente-selector" style="display:none;">
        <div class="residente-pill" onclick="toggleResidenteDropdown(event)">
          <span id="residente-activo-nombre">Todos</span>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="residente-dropdown" id="residente-dropdown">
          <div class="residente-dropdown-header">Ver residente</div>
        </div>
      </div>
      <div class="nav-avatar" id="nav-avatar">?</div>
      <span class="nav-name" id="nav-name">...</span>
      <a href="/logout" class="nav-logout">Salir</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div class="page-title">Mis Facturas</div>
          <div class="page-subtitle">Historial de facturas generadas con sus archivos XML y PDF</div>
        </div>
        <a href="/mis-tickets" class="btn btn-outline">Ver tickets</a>
      </div>
    </div>

    <div class="facturas-card">
      <div class="facturas-card-header">
        <div class="card-title">Facturas generadas</div>
        <span id="facturas-count" style="font-size:0.8rem;color:var(--text-muted);font-weight:600;"></span>
      </div>
      <div id="lista">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <div class="empty-title">Cargando...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeResidenteId = sessionStorage.getItem('activeResidenteId') || null;
    let activeResidenteNombre = sessionStorage.getItem('activeResidenteNombre') || 'Todos';

    async function initNav() {
      try {
        const res = await fetch('/api/me');
        const me = await res.json();
        const initials = (me.nombre || '').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || '?';
        document.getElementById('nav-avatar').textContent = initials;
        document.getElementById('nav-name').textContent = me.nombre || '';
        if (me.rol === 'admin') document.getElementById('nav-admin').style.display = 'inline-flex';
        await initResidenteSelector();
      } catch {}
    }

    async function initResidenteSelector() {
      const res = await fetch('/api/residentes');
      const data = await res.json();
      if (!data.ok || data.residentes.length <= 1) return;
      const selector = document.getElementById('residente-selector');
      selector.style.display = 'block';
      document.getElementById('residente-activo-nombre').textContent = activeResidenteNombre;
      const dropdown = document.getElementById('residente-dropdown');
      const opts = [
        `<div class="residente-option ${!activeResidenteId ? 'active' : ''}" onclick="seleccionarResidente(null,'Todos')"><span class="r-dot"></span>Todos</div>`
      ].concat(data.residentes.map(r =>
        `<div class="residente-option ${activeResidenteId == r.id ? 'active' : ''}" onclick="seleccionarResidente(${r.id},'${r.nombre}')"><span class="r-dot"></span>${r.nombre}</div>`
      ));
      dropdown.innerHTML = '<div class="residente-dropdown-header">Ver residente</div>' + opts.join('');
    }

    function toggleResidenteDropdown(e) {
      e.stopPropagation();
      document.getElementById('residente-dropdown').classList.toggle('open');
    }

    function seleccionarResidente(id, nombre) {
      activeResidenteId = id ? String(id) : null;
      activeResidenteNombre = nombre;
      id ? sessionStorage.setItem('activeResidenteId', id) : sessionStorage.removeItem('activeResidenteId');
      sessionStorage.setItem('activeResidenteNombre', nombre);
      document.getElementById('residente-activo-nombre').textContent = nombre;
      document.getElementById('residente-dropdown').classList.remove('open');
      cargarFacturas();
    }

    document.addEventListener('click', e => {
      const sel = document.getElementById('residente-selector');
      if (sel && !sel.contains(e.target)) document.getElementById('residente-dropdown').classList.remove('open');
    });

    async function cargarFacturas() {
      const url = '/api/facturas' + (activeResidenteId ? `?residente_id=${activeResidenteId}` : '');
      const res = await fetch(url);
      const data = await res.json();
      const lista = document.getElementById('lista');

      if (!data.ok || data.facturas.length === 0) {
        lista.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🧾</div>
            <div class="empty-title">Sin facturas aún</div>
            <div class="empty-desc">Ve a tus tickets y factura uno para verlo aquí</div>
            <a href="/mis-tickets" class="btn btn-primary">Ir a mis tickets</a>
          </div>`;
        document.getElementById('facturas-count').textContent = '0 facturas';
        return;
      }

      document.getElementById('facturas-count').textContent = `${data.facturas.length} factura${data.facturas.length !== 1 ? 's' : ''}`;

      lista.innerHTML = data.facturas.map(f => {
        const statusBadge = f.status === 'completado'
          ? '<span class="badge badge-success">Completado</span>'
          : '<span class="badge badge-pending">Pendiente</span>';

        const xmlBtn = f.xml_url
          ? `<a href="${f.xml_url}" target="_blank" class="btn-xml">⬇ XML</a>`
          : '';
        const pdfBtn = f.pdf_url
          ? `<a href="${f.pdf_url}" target="_blank" class="btn-pdf">⬇ PDF</a>`
          : '';

        const fecha = new Date(f.creado).toLocaleDateString('es-MX', {
          day: '2-digit', month: 'long', year: 'numeric'
        });

        return `
          <div class="factura-row">
            <div class="factura-main">
              <div class="factura-name">${f.comercio || 'Comercio'}</div>
              <div class="factura-meta">${fecha}</div>
            </div>
            <div class="factura-right">
              ${statusBadge}
              ${xmlBtn}
              ${pdfBtn}
            </div>
          </div>`;
      }).join('');
    }

    initNav();
    cargarFacturas();
  </script>
</body>
</html>
