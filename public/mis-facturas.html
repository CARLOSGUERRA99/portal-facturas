<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Facturas - Portal Facturas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0d0d0d; color: #fff; }
    .header { background: #1a1a1a; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #7AC142; }
    .header h1 { color: #7AC142; font-size: 20px; }
    .nav a { color: #aaa; text-decoration: none; margin-left: 1rem; font-size: 14px; }
    .nav a:hover { color: #7AC142; }
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h2 { color: #7AC142; margin-bottom: 1.5rem; }
    .factura { background: #1a1a1a; border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1rem; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .factura-info h4 { font-size: 15px; margin-bottom: 4px; }
    .factura-info p { font-size: 12px; color: #aaa; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .badge-completado { background: #1a3a1a; color: #7AC142; }
    .badge-pendiente { background: #333; color: #FFB347; }
    .btns { display: flex; gap: 8px; }
    .btn-down { padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
    .btn-xml { background: #1a3a5a; color: #5bc0eb; }
    .btn-pdf { background: #3a1a1a; color: #ff6b6b; }
    .btn-xml:hover { background: #1a4a6a; }
    .btn-pdf:hover { background: #4a1a1a; }
    .empty { text-align: center; color: #aaa; padding: 3rem; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Portal Facturas</h1>
    <div class="nav">
      <a href="/dashboard">Inicio</a>
      <a href="/mis-tickets">Mis Tickets</a>
      <a href="/mis-facturas">Mis Facturas</a>
      <a href="/logout">Salir</a>
    </div>
  </div>

  <div class="container">
    <h2>🧾 Mis Facturas</h2>
    <div id="lista"></div>
  </div>

  <script>
    async function cargarFacturas() {
      const res = await fetch("/api/facturas");
      const data = await res.json();
      const lista = document.getElementById("lista");

      if (!data.ok || data.facturas.length === 0) {
        lista.innerHTML = '<div class="empty">No tienes facturas aún. <a href="/mis-tickets" style="color:#7AC142">Ve a tus tickets</a> y factura uno.</div>';
        return;
      }

      lista.innerHTML = data.facturas.map(f => {
        const badgeClass = f.status === "completado" ? "badge-completado" : "badge-pendiente";
        const xmlBtn = f.xml_url ? `<a href="${f.xml_url}" target="_blank" class="btn-down btn-xml">⬇ XML</a>` : "";
        const pdfBtn = f.pdf_url ? `<a href="${f.pdf_url}" target="_blank" class="btn-down btn-pdf">⬇ PDF</a>` : "";
        return `
          <div class="factura">
            <div class="factura-info">
              <h4>🏪 ${f.comercio || "Comercio"}</h4>
              <p>${new Date(f.creado).toLocaleDateString('es-MX', {year:'numeric',month:'long',day:'numeric'})}</p>
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
              <span class="badge ${badgeClass}">${f.status}</span>
              <div class="btns">${xmlBtn}${pdfBtn}</div>
            </div>
          </div>`;
      }).join("");
    }

    cargarFacturas();
  </script>
</body>
</html>
