<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Facturas — GPN Portal Facturas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/notificaciones.js"></script>
  <style>
    .factura-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid #f0f4ec; transition: background 0.15s; }
    .factura-row:last-child { border-bottom: none; }
    .factura-row:hover { background: #fafcf8; }
    .factura-main { flex: 1; min-width: 0; }
    .factura-name { font-weight: 600; font-size: 0.9rem; color: var(--text); margin-bottom: 3px; }
    .factura-meta { font-size: 0.78rem; color: var(--text-muted); }
    .factura-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .facturas-card { background: white; border-radius: var(--card-radius); box-shadow: var(--shadow); overflow: hidden; }
    .facturas-card-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 16px; border-bottom: 1px solid #f0f4ec; }

    .btn-xml {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: 9px; font-size: 0.78rem; font-weight: 600;
      text-decoration: none; transition: all 0.18s; border: 1.5px solid;
      background: #e8f0fe; color: #1a6ae0; border-color: #c2d4f8;
    }
    .btn-xml:hover { background: #d0e4fd; }

    .btn-pdf {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: 9px; font-size: 0.78rem; font-weight: 600;
      text-decoration: none; transition: all 0.18s; border: 1.5px solid;
      background: #fef0ef; color: var(--error); border-color: #fad7d5;
    }
    .btn-pdf:hover { background: #fad7d5; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/dashboard" class="nav-brand">
      <div class="nav-brand-icon">🎨</div>
      <div>
        <div class="nav-brand-name">GPN</div>
        <div class="nav-brand-sub">Pinturas y Recubrimientos</div>
      </div>
    </a>
    <div class="nav-links">
      <a href="/dashboard" class="nav-link">Inicio</a>
      <a href="/mis-tickets" class="nav-link">Mis Tickets</a>
      <a href="/mis-facturas" class="nav-link active">Mis Facturas</a>
      <a href="/perfil" class="nav-link">Mi Perfil</a>
      <a href="/admin-residentes" class="nav-link" id="nav-admin" style="display:none;">Admin</a>
    </div>
    <div class="nav-right">
      <div class="residente-selector" id="residente-selector" style="display:none;">
        <div class="residente-pill" onclick="toggleResidenteDropdown(event)">
          <span id="residente-activo-nombre">Todos</span>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="residente-dropdown" id="residente-dropdown">
          <div class="residente-dropdown-header">Ver residente</div>
        </div>
      </div>
      <div class="notif-wrapper" id="notif-wrapper">
        <button class="notif-bell" onclick="toggleNotifDropdown(event)" title="Notificaciones">🔔
          <span class="notif-badge" id="notif-badge" style="display:none;"></span>
        </button>
        <div class="notif-dropdown" id="notif-dropdown">
          <div class="notif-header">
            <span class="notif-header-title">Notificaciones</span>
            <button class="notif-leer-todas" onclick="leerTodas()">Marcar todas</button>
          </div>
          <div class="notif-lista" id="notif-lista"></div>
        </div>
      </div>
      <div class="nav-avatar" id="nav-avatar">?</div>
      <span class="nav-name" id="nav-name">...</span>
      <a href="/logout" class="nav-logout">Salir</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div class="page-title">Mis Facturas</div>
          <div class="page-subtitle">Historial de facturas generadas con sus archivos XML y PDF</div>
        </div>
        <a href="/mis-tickets" class="btn btn-outline">Ver tickets</a>
      </div>
    </div>

    <div class="residente-tabs" id="residente-tabs" style="display:none;"></div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <select id="filtro-mes" onchange="renderFacturas()" style="padding:8px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:0.85rem;background:white;color:var(--text);outline:none;cursor:pointer;">
        <option value="">Todos los meses</option>
      </select>
    </div>

    <div class="facturas-card">
      <div class="facturas-card-header">
        <div class="card-title">Facturas generadas</div>
        <span id="facturas-count" style="font-size:0.8rem;color:var(--text-muted);font-weight:600;"></span>
      </div>
      <div id="lista">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <div class="empty-title">Cargando...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeResidenteId = sessionStorage.getItem('activeResidenteId') || null;
    let activeResidenteNombre = sessionStorage.getItem('activeResidenteNombre') || 'Todos';

    async function initNav() {
      try {
        const res = await fetch('/api/me');
        const me = await res.json();
        const initials = (me.nombre || '').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || '?';
        document.getElementById('nav-avatar').textContent = initials;
        document.getElementById('nav-name').textContent = me.nombre || '';
        if (me.rol === 'admin') document.getElementById('nav-admin').style.display = 'inline-flex';
        await initResidenteSelector();
      } catch {}
    }

    async function initResidenteSelector() {
      const res = await fetch('/api/residentes');
      const data = await res.json();
      if (!data.ok || data.residentes.length <= 1) return;
      const selector = document.getElementById('residente-selector');
      selector.style.display = 'block';
      document.getElementById('residente-activo-nombre').textContent = activeResidenteNombre;
      const dropdown = document.getElementById('residente-dropdown');
      const opts = [
        `<div class="residente-option ${!activeResidenteId ? 'active' : ''}" onclick="seleccionarResidente(null,'Todos')"><span class="r-dot"></span>Todos</div>`
      ].concat(data.residentes.map(r =>
        `<div class="residente-option ${activeResidenteId == r.id ? 'active' : ''}" onclick="seleccionarResidente(${r.id},'${r.nombre}')"><span class="r-dot"></span>${r.nombre}</div>`
      ));
      dropdown.innerHTML = '<div class="residente-dropdown-header">Ver residente</div>' + opts.join('');
    }

    function toggleResidenteDropdown(e) {
      e.stopPropagation();
      document.getElementById('residente-dropdown').classList.toggle('open');
    }

    function seleccionarResidente(id, nombre) {
      activeResidenteId = id ? String(id) : null;
      activeResidenteNombre = nombre;
      id ? sessionStorage.setItem('activeResidenteId', id) : sessionStorage.removeItem('activeResidenteId');
      sessionStorage.setItem('activeResidenteNombre', nombre);
      document.getElementById('residente-activo-nombre').textContent = nombre;
      document.getElementById('residente-dropdown').classList.remove('open');
      document.querySelectorAll('.residente-tab').forEach(t => {
        t.classList.toggle('active', (t.dataset.rid || '') === (activeResidenteId || ''));
      });
      cargarFacturas();
    }

    async function cargarTabs() {
      const res = await fetch('/api/residentes/mis-residentes');
      const data = await res.json();
      if (!data.ok || data.residentes.length <= 1) return;
      const tabsEl = document.getElementById('residente-tabs');
      tabsEl.style.display = 'flex';
      const total = data.residentes.reduce((a, r) => a + Number(r.factura_count), 0);
      const allTab = `<button class="residente-tab ${!activeResidenteId ? 'active' : ''}" data-rid="" onclick="selectTab(null,'Todos',this)">Todos <span class="tab-badge">${total}</span></button>`;
      const rTabs = data.residentes.map(r =>
        `<button class="residente-tab ${activeResidenteId == r.id ? 'active' : ''}" data-rid="${r.id}" onclick="selectTab(${r.id},'${r.nombre.replace(/'/g,"\\'")}',this)">${r.nombre} <span class="tab-badge">${r.factura_count}</span></button>`
      );
      tabsEl.innerHTML = [allTab, ...rTabs].join('');
    }

    function selectTab(id, nombre, btn) {
      activeResidenteId = id ? String(id) : null;
      activeResidenteNombre = nombre;
      id ? sessionStorage.setItem('activeResidenteId', id) : sessionStorage.removeItem('activeResidenteId');
      sessionStorage.setItem('activeResidenteNombre', nombre);
      document.querySelectorAll('.residente-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const pill = document.getElementById('residente-activo-nombre');
      if (pill) pill.textContent = nombre;
      cargarFacturas();
    }

    document.addEventListener('click', e => {
      const sel = document.getElementById('residente-selector');
      if (sel && !sel.contains(e.target)) document.getElementById('residente-dropdown').classList.remove('open');
    });

    let _todasFacturas = [];

    async function cargarFacturas() {
      const url = '/api/facturas' + (activeResidenteId ? `?residente_id=${activeResidenteId}` : '');
      const res = await fetch(url);
      const data = await res.json();

      if (!data.ok) {
        document.getElementById('lista').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Error al cargar</div></div>`;
        return;
      }

      _todasFacturas = data.facturas || [];
      poblarFiltroMes(_todasFacturas);
      renderFacturas();
    }

    function poblarFiltroMes(facturas) {
      const meses = new Map();
      const MESES_LABEL = { '01':'Enero','02':'Febrero','03':'Marzo','04':'Abril','05':'Mayo','06':'Junio','07':'Julio','08':'Agosto','09':'Septiembre','10':'Octubre','11':'Noviembre','12':'Diciembre' };
      facturas.forEach(f => {
        const d = new Date(f.creado);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const key = `${y}-${m}`;
        if (!meses.has(key)) meses.set(key, `${MESES_LABEL[m]} ${y}`);
      });
      const sel = document.getElementById('filtro-mes');
      const current = sel.value;
      sel.innerHTML = '<option value="">Todos los meses</option>' +
        [...meses.entries()].sort((a,b) => b[0].localeCompare(a[0]))
          .map(([k, label]) => `<option value="${k}" ${k === current ? 'selected' : ''}>${label}</option>`).join('');
    }

    function renderFacturas() {
      const lista = document.getElementById('lista');
      const mesFiltro = document.getElementById('filtro-mes').value;

      let facturas = _todasFacturas;
      if (mesFiltro) {
        facturas = facturas.filter(f => {
          const d = new Date(f.creado);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          return `${y}-${m}` === mesFiltro;
        });
      }

      if (facturas.length === 0) {
        lista.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🧾</div>
            <div class="empty-title">Sin facturas aún</div>
            <div class="empty-desc">Ve a tus tickets y factura uno para verlo aquí</div>
            <a href="/mis-tickets" class="btn btn-primary">Ir a mis tickets</a>
          </div>`;
        document.getElementById('facturas-count').textContent = '0 facturas';
        return;
      }

      document.getElementById('facturas-count').textContent = `${facturas.length} factura${facturas.length !== 1 ? 's' : ''}`;

      lista.innerHTML = facturas.map(f => {
        let ocr = {};
        try { ocr = JSON.parse(f.ocr_json || '{}'); } catch {}

        const folioTicket = ocr.folio || ocr.folioFactura || ocr.noTicket || '';
        const total = ocr.total ? `$${parseFloat(ocr.total).toFixed(2)}` : '';
        const folioId = folioTicket || f.id;

        const xmlBtn = f.xml_url
          ? `<a href="${f.xml_url}" download="factura_${folioId}.xml" target="_blank" class="btn-xml">⬇ XML</a>`
          : '';
        const pdfBtn = f.pdf_url
          ? `<a href="${f.pdf_url}" download="factura_${folioId}.pdf" target="_blank" class="btn-pdf">⬇ PDF</a>`
          : '';

        const fecha = new Date(f.creado).toLocaleDateString('es-MX', {
          day: '2-digit', month: 'long', year: 'numeric'
        });

        const meta = [fecha, folioTicket ? `Folio ${folioTicket}` : '', total].filter(Boolean).join(' · ');

        return `
          <div class="factura-row">
            <div class="factura-main">
              <div class="factura-name">${f.comercio || 'Comercio'}</div>
              <div class="factura-meta">${meta}</div>
            </div>
            <div class="factura-right">
              ${xmlBtn}
              ${pdfBtn}
            </div>
          </div>`;
      }).join('');
    }

    initNav();
    cargarFacturas();
    cargarTabs();
    initNotificaciones();
  </script>
  <!-- WhatsApp bubble -->
  <style>
    .wa-bubble{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;align-items:center;gap:10px;cursor:pointer;}
    .wa-btn{width:56px;height:56px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(37,211,102,0.45);transition:transform 0.15s,box-shadow 0.15s;}
    .wa-btn:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(37,211,102,0.55);}
    .wa-btn svg{width:30px;height:30px;fill:white;}
    .wa-tooltip{background:white;color:#1a1a1a;font-size:0.82rem;font-weight:600;padding:8px 13px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.12);white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(6px);transition:opacity 0.2s,transform 0.2s;}
    .wa-bubble:hover .wa-tooltip{opacity:1;transform:translateX(0);}
  </style>
  <div class="wa-bubble" onclick="window.open('https://wa.me/526443615568?text=' + encodeURIComponent('Hola, necesito ayuda con el portal de facturación.'), '_blank')">
    <div class="wa-tooltip">¿Necesitas ayuda?</div>

      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 0C7.163 0 0 7.163 0 16c0 2.833.738 5.488 2.031 7.794L0 32l8.418-2.009A15.93 15.93 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm0 29.333a13.27 13.27 0 01-6.818-1.877l-.488-.293-5.003 1.194 1.227-4.872-.32-.503A13.267 13.267 0 012.667 16C2.667 8.636 8.636 2.667 16 2.667S29.333 8.636 29.333 16 23.364 29.333 16 29.333zm7.293-9.907c-.4-.2-2.368-1.168-2.735-1.301-.368-.133-.635-.2-.902.2-.267.4-1.034 1.301-1.268 1.568-.233.267-.467.3-.867.1-.4-.2-1.688-.622-3.215-1.981-1.188-1.058-1.99-2.365-2.223-2.765-.233-.4-.025-.616.175-.815.18-.178.4-.467.6-.7.2-.233.267-.4.4-.667.133-.267.067-.5-.033-.7-.1-.2-.902-2.168-1.235-2.968-.325-.78-.655-.674-.902-.686l-.768-.013c-.267 0-.7.1-1.067.5-.368.4-1.4 1.368-1.4 3.335 0 1.967 1.433 3.868 1.633 4.135.2.267 2.82 4.305 6.833 6.034.955.412 1.7.659 2.281.844.958.305 1.831.262 2.52.159.769-.115 2.368-.969 2.702-1.904.333-.935.333-1.736.233-1.904-.1-.167-.367-.267-.767-.467z"/></svg>
    </div>
  </div>

</body>
</html>
