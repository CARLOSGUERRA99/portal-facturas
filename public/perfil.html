<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil Fiscal — GPN Portal Facturas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .section-label {
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--green);
      margin: 28px 0 16px;
      padding-bottom: 10px;
      border-bottom: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label:first-of-type { margin-top: 0; }
    .perfil-card { max-width: 780px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/dashboard" class="nav-brand">
      <div class="nav-brand-icon">🎨</div>
      <div>
        <div class="nav-brand-name">GPN</div>
        <div class="nav-brand-sub">Pinturas y Recubrimientos</div>
      </div>
    </a>
    <div class="nav-links">
      <a href="/dashboard" class="nav-link" data-page="dashboard">Inicio</a>
      <a href="/mis-tickets" class="nav-link" data-page="mis-tickets">Mis Tickets</a>
      <a href="/mis-facturas" class="nav-link" data-page="mis-facturas">Mis Facturas</a>
      <a href="/perfil" class="nav-link active" data-page="perfil">Mi Perfil</a>
    </div>
    <div class="nav-right">
      <div class="nav-avatar" id="nav-avatar">?</div>
      <span class="nav-name" id="nav-name">...</span>
      <a href="/logout" class="nav-logout">Salir</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div class="page-title">Mi Perfil Fiscal</div>
      <div class="page-subtitle">Estos datos se usan automáticamente al generar facturas</div>
    </div>

    <div class="card perfil-card">

      <div id="save-success" class="alert alert-success"></div>
      <div id="save-error" class="alert alert-error"></div>

      <!-- Datos fiscales -->
      <div class="section-label">📋 Datos fiscales</div>

      <div class="form-row">
        <div class="form-group">
          <label class="label">RFC <span style="color:var(--error)">*</span></label>
          <input type="text" id="rfc" class="input" placeholder="XAXX010101000" maxlength="13" style="text-transform:uppercase">
        </div>
        <div class="form-group">
          <label class="label">Razón Social <span style="color:var(--error)">*</span></label>
          <input type="text" id="razon_social" class="input" placeholder="Nombre o empresa" style="text-transform:uppercase">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="label">Régimen Fiscal <span style="color:var(--error)">*</span></label>
          <select id="regimen_fiscal" class="input">
            <option value="">Seleccionar régimen...</option>
            <option value="601">601 — General de Ley Personas Morales</option>
            <option value="612">612 — Personas Físicas con Act. Empresariales</option>
            <option value="616">616 — Sin obligaciones fiscales</option>
            <option value="621">621 — Incorporación Fiscal</option>
            <option value="626">626 — Régimen Simplificado de Confianza</option>
          </select>
        </div>
        <div class="form-group">
          <label class="label">Uso CFDI <span style="color:var(--error)">*</span></label>
          <select id="uso_cfdi" class="input">
            <option value="">Seleccionar uso...</option>
            <option value="G01">G01 — Adquisición de mercancías</option>
            <option value="G03">G03 — Gastos en general</option>
            <option value="I01">I01 — Construcciones</option>
            <option value="S01">S01 — Sin efectos fiscales</option>
          </select>
        </div>
      </div>

      <!-- Domicilio fiscal -->
      <div class="section-label">🏠 Domicilio fiscal</div>

      <div class="form-row">
        <div class="form-group" style="grid-column: 1 / -1;">
          <label class="label">Calle <span style="color:var(--error)">*</span></label>
          <input type="text" id="calle" class="input" placeholder="Nombre de la calle" style="text-transform:uppercase">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="label">Número Exterior <span style="color:var(--error)">*</span></label>
          <input type="text" id="num_ext" class="input" placeholder="123">
        </div>
        <div class="form-group">
          <label class="label">Número Interior</label>
          <input type="text" id="num_int" class="input" placeholder="Opcional (depto, piso...)">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="label">Colonia <span style="color:var(--error)">*</span></label>
          <input type="text" id="colonia" class="input" placeholder="Nombre de la colonia" style="text-transform:uppercase">
        </div>
        <div class="form-group">
          <label class="label">Municipio / Delegación <span style="color:var(--error)">*</span></label>
          <input type="text" id="municipio" class="input" placeholder="Ciudad Obregón" style="text-transform:uppercase">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="label">Código Postal <span style="color:var(--error)">*</span></label>
          <input type="text" id="codigo_postal" class="input" placeholder="85000" maxlength="5" inputmode="numeric">
        </div>
        <div class="form-group">
          <label class="label">Estado <span style="color:var(--error)">*</span></label>
          <select id="estado" class="input">
            <option value="">Seleccionar estado...</option>
            <option value="AGUASCALIENTES">Aguascalientes</option>
            <option value="BAJA CALIFORNIA">Baja California</option>
            <option value="BAJA CALIFORNIA SUR">Baja California Sur</option>
            <option value="CAMPECHE">Campeche</option>
            <option value="CHIAPAS">Chiapas</option>
            <option value="CHIHUAHUA">Chihuahua</option>
            <option value="CIUDAD DE MEXICO">Ciudad de México</option>
            <option value="COAHUILA">Coahuila</option>
            <option value="COLIMA">Colima</option>
            <option value="DURANGO">Durango</option>
            <option value="ESTADO DE MEXICO">Estado de México</option>
            <option value="GUANAJUATO">Guanajuato</option>
            <option value="GUERRERO">Guerrero</option>
            <option value="HIDALGO">Hidalgo</option>
            <option value="JALISCO">Jalisco</option>
            <option value="MICHOACAN">Michoacán</option>
            <option value="MORELOS">Morelos</option>
            <option value="NAYARIT">Nayarit</option>
            <option value="NUEVO LEON">Nuevo León</option>
            <option value="OAXACA">Oaxaca</option>
            <option value="PUEBLA">Puebla</option>
            <option value="QUERETARO">Querétaro</option>
            <option value="QUINTANA ROO">Quintana Roo</option>
            <option value="SAN LUIS POTOSI">San Luis Potosí</option>
            <option value="SINALOA">Sinaloa</option>
            <option value="SONORA">Sonora</option>
            <option value="TABASCO">Tabasco</option>
            <option value="TAMAULIPAS">Tamaulipas</option>
            <option value="TLAXCALA">Tlaxcala</option>
            <option value="VERACRUZ">Veracruz</option>
            <option value="YUCATAN">Yucatán</option>
            <option value="ZACATECAS">Zacatecas</option>
          </select>
        </div>
      </div>

      <div style="margin-top:8px;">
        <button class="btn btn-primary" id="btn-guardar" onclick="guardar()">Guardar perfil</button>
      </div>

    </div>
  </div>

  <script>
    async function initNav() {
      try {
        const res = await fetch('/api/me');
        const me = await res.json();
        const initials = (me.nombre || '').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || '?';
        document.getElementById('nav-avatar').textContent = initials;
        document.getElementById('nav-name').textContent = me.nombre || '';
      } catch {}
    }

    async function cargar() {
      try {
        const res = await fetch('/api/perfil');
        const data = await res.json();
        if (!data.ok) return;
        const p = data.perfil;
        const fields = ['rfc','razon_social','regimen_fiscal','uso_cfdi','calle','num_ext','num_int','colonia','municipio','codigo_postal','estado'];
        fields.forEach(f => {
          const el = document.getElementById(f);
          if (el) el.value = p[f] || '';
        });
      } catch {}
    }

    async function guardar() {
      const suc = document.getElementById('save-success');
      const err = document.getElementById('save-error');
      const btn = document.getElementById('btn-guardar');
      suc.style.display = 'none';
      err.style.display = 'none';

      const str = id => document.getElementById(id)?.value.trim() || '';
      const body = {
        rfc: str('rfc').toUpperCase(),
        razon_social: str('razon_social').toUpperCase(),
        regimen_fiscal: str('regimen_fiscal'),
        uso_cfdi: str('uso_cfdi'),
        calle: str('calle').toUpperCase(),
        num_ext: str('num_ext'),
        num_int: str('num_int'),
        colonia: str('colonia').toUpperCase(),
        municipio: str('municipio').toUpperCase(),
        codigo_postal: str('codigo_postal'),
        estado: str('estado'),
      };

      const required = ['rfc','razon_social','regimen_fiscal','uso_cfdi','calle','num_ext','colonia','municipio','codigo_postal','estado'];
      const missing = required.filter(f => !body[f]);
      if (missing.length > 0) {
        err.textContent = 'Por favor completa todos los campos obligatorios (*)';
        err.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando...';

      try {
        const res = await fetch('/api/perfil', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.ok) {
          suc.textContent = 'Perfil fiscal guardado correctamente.';
          suc.style.display = 'block';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          err.textContent = data.msg || 'Error al guardar el perfil';
          err.style.display = 'block';
        }
      } catch {
        err.textContent = 'Error de conexión. Intenta de nuevo.';
        err.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Guardar perfil';
    }

    initNav();
    cargar();
  </script>
</body>
</html>
