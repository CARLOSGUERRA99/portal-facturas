<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>En construcción — GPN Facturas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4ec;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(59,109,17,0.10);
      padding: 56px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      display: block;
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #3B6D11;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1a2e0a;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    p {
      font-size: 15px;
      color: #5a6e4a;
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      background: #eaf3de;
      color: #3B6D11;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 20px;
      margin-top: 24px;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #aab89a;
    }

    @media (max-width: 480px) {
      .card { padding: 40px 24px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🔧</span>
    <div class="logo">GPN Facturas</div>
    <h1>Estamos mejorando el sistema</h1>
    <p>
      Nuestro portal está en mantenimiento programado.<br>
      Estamos trabajando para ofrecerte una mejor experiencia.
    </p>
    <p>
      Si tienes alguna duda, contáctanos directamente.
    </p>
    <span class="badge">Volvemos pronto</span>
    <div class="footer">GPN Pinturas y Recubrimientos &mdash; Portal de Facturación</div>
  </div>
</body>
</html>
