<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Tickets - Portal Facturas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0d0d0d; color: #fff; }
    .header { background: #1a1a1a; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #7AC142; }
    .header h1 { color: #7AC142; font-size: 20px; }
    .nav a { color: #aaa; text-decoration: none; margin-left: 1rem; font-size: 14px; }
    .nav a:hover { color: #7AC142; }
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h2 { color: #7AC142; margin-bottom: 1.5rem; }
    .ticket { background: #1a1a1a; border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1rem; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .ticket-info h4 { font-size: 15px; margin-bottom: 4px; }
    .ticket-info p { font-size: 12px; color: #aaa; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .badge-pendiente { background: #333; color: #FFB347; }
    .badge-procesado { background: #1a3a1a; color: #7AC142; }
    .badge-error { background: #3a1a1a; color: #ff6b6b; }
    .btn-facturar { background: #7AC142; color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-facturar:hover { background: #6ab33a; }
    .btn-facturar:disabled { background: #444; color: #888; cursor: not-allowed; }
    .empty { text-align: center; color: #aaa; padding: 3rem; }
    .datos { font-size: 12px; color: #7AC142; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Portal Facturas</h1>
    <div class="nav">
      <a href="/dashboard">Inicio</a>
      <a href="/mis-tickets">Mis Tickets</a>
      <a href="/mis-facturas">Mis Facturas</a>
      <a href="/logout">Salir</a>
    </div>
  </div>

  <div class="container">
    <h2>📋 Mis Tickets</h2>
    <div id="lista"></div>
  </div>

  <script>
    async function cargarTickets() {
      const res = await fetch("/api/tickets");
      const data = await res.json();
      const lista = document.getElementById("lista");

      if (!data.ok || data.tickets.length === 0) {
        lista.innerHTML = '<div class="empty">No tienes tickets aún. <a href="/dashboard" style="color:#7AC142">Sube uno</a></div>';
        return;
      }

      lista.innerHTML = data.tickets.map(t => {
        let datos = {};
        try { datos = JSON.parse(t.ocr_json || "{}"); } catch {}
        const datosStr = datos.fecha ? `📅 ${datos.fecha} | 💰 $${datos.total} | 🔢 ${datos.folio}` : "";
        const badgeClass = t.status === "procesado" ? "badge-procesado" : t.status === "error" ? "badge-error" : "badge-pendiente";
        const btnDisabled = t.status === "procesado" ? "disabled" : "";
        return `
          <div class="ticket">
            <div class="ticket-info">
              <h4>🏪 ${t.comercio || "Comercio desconocido"}</h4>
              <p>${t.nombre_archivo} · ${new Date(t.creado).toLocaleDateString()}</p>
              <p class="datos">${datosStr}</p>
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
              <span class="badge ${badgeClass}">${t.status}</span>
              <button class="btn-facturar" ${btnDisabled} onclick="facturar(${t.id}, this)">Facturar</button>
            </div>
          </div>`;
      }).join("");
    }

    async function facturar(ticketId, btn) {
      btn.disabled = true;
      btn.textContent = "Procesando...";
      const res = await fetch(`/facturar/${ticketId}`, { method: "POST" });
      const data = await res.json();
      if (data.ok) {
        btn.textContent = "✅ Facturado";
        cargarTickets();
      } else {
        btn.textContent = "❌ Error";
        btn.style.background = "#ff6b6b";
        alert("Error: " + data.msg);
      }
    }

    cargarTickets();
  </script>
</body>
</html>
