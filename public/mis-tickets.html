<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Tickets — GPN Portal Facturas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/notificaciones.js"></script>
  <style>
    .ticket-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid #f0f4ec; transition: background 0.15s; }
    .ticket-row:last-child { border-bottom: none; }
    .ticket-row:hover { background: #fafcf8; }
    .ticket-main { flex: 1; min-width: 0; }
    .ticket-name { font-weight: 600; font-size: 0.9rem; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ticket-meta { font-size: 0.78rem; color: var(--text-muted); }
    .ticket-datos { font-size: 0.8rem; color: var(--green); font-weight: 500; margin-top: 3px; }
    .ticket-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .tickets-card { background: white; border-radius: var(--card-radius); box-shadow: var(--shadow); overflow: hidden; }
    .tickets-card-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 16px; border-bottom: 1px solid #f0f4ec; }
    /* Modal editar datos */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:9000; align-items:center; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:white; border-radius:16px; padding:28px 28px 24px; width:100%; max-width:420px; box-shadow:0 8px 40px rgba(0,0,0,0.18); }
    .modal-title { font-weight:700; font-size:1.05rem; color:var(--text); margin-bottom:18px; }
    .modal-field { margin-bottom:14px; }
    .modal-field label { display:block; font-size:0.8rem; font-weight:600; color:var(--text-muted); margin-bottom:5px; }
    .modal-field input { width:100%; padding:9px 12px; border:1.5px solid #e5e7eb; border-radius:8px; font-size:0.9rem; outline:none; box-sizing:border-box; }
    .modal-field input:focus { border-color:var(--green); }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/dashboard" class="nav-brand">
      <div class="nav-brand-icon">🎨</div>
      <div>
        <div class="nav-brand-name">GPN</div>
        <div class="nav-brand-sub">Pinturas y Recubrimientos</div>
      </div>
    </a>
    <div class="nav-links">
      <a href="/dashboard" class="nav-link">Inicio</a>
      <a href="/mis-tickets" class="nav-link active">Mis Tickets</a>
      <a href="/mis-facturas" class="nav-link">Mis Facturas</a>
      <a href="/perfil" class="nav-link">Mi Perfil</a>
      <a href="/admin-residentes" class="nav-link" id="nav-admin" style="display:none;">Admin</a>
    </div>
    <div class="nav-right">
      <div class="residente-selector" id="residente-selector" style="display:none;">
        <div class="residente-pill" onclick="toggleResidenteDropdown(event)">
          <span id="residente-activo-nombre">Todos</span>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="residente-dropdown" id="residente-dropdown">
          <div class="residente-dropdown-header">Ver residente</div>
        </div>
      </div>
      <div class="notif-wrapper" id="notif-wrapper">
        <button class="notif-bell" onclick="toggleNotifDropdown(event)" title="Notificaciones">🔔
          <span class="notif-badge" id="notif-badge" style="display:none;"></span>
        </button>
        <div class="notif-dropdown" id="notif-dropdown">
          <div class="notif-header">
            <span class="notif-header-title">Notificaciones</span>
            <button class="notif-leer-todas" onclick="leerTodas()">Marcar todas</button>
          </div>
          <div class="notif-lista" id="notif-lista"></div>
        </div>
      </div>
      <div class="nav-avatar" id="nav-avatar">?</div>
      <span class="nav-name" id="nav-name">...</span>
      <a href="/logout" class="nav-logout">Salir</a>
    </div>
  </nav>

  <!-- Modal editar datos OCR -->
  <div class="modal-overlay" id="modal-editar">
    <div class="modal-box">
      <div class="modal-title">Editar datos del ticket</div>
      <div id="modal-fields"></div>
      <div class="modal-actions">
        <button class="btn btn-sm" onclick="cerrarModal()" style="background:#f3f4f6;color:#374151;">Cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="guardarDatos()">Guardar y reintentar</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div class="page-title">Mis Tickets</div>
          <div class="page-subtitle">Gestiona y factura tus tickets de compra</div>
        </div>
        <a href="/dashboard" class="btn btn-primary">+ Subir ticket</a>
      </div>
    </div>

    <div id="alert-factura" class="alert"></div>

    <div class="residente-tabs" id="residente-tabs" style="display:none;"></div>

    <div class="tickets-card" id="tickets-container">
      <div class="tickets-card-header">
        <div class="card-title">Todos los tickets</div>
        <span id="tickets-count" style="font-size:0.8rem;color:var(--text-muted);font-weight:600;"></span>
      </div>
      <div id="lista">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <div class="empty-title">Cargando...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeResidenteId = sessionStorage.getItem('activeResidenteId') || null;
    let activeResidenteNombre = sessionStorage.getItem('activeResidenteNombre') || 'Todos';

    async function initNav() {
      try {
        const res = await fetch('/api/me');
        const me = await res.json();
        const initials = (me.nombre || '').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || '?';
        document.getElementById('nav-avatar').textContent = initials;
        document.getElementById('nav-name').textContent = me.nombre || '';
        if (me.rol === 'admin') document.getElementById('nav-admin').style.display = 'inline-flex';
        await initResidenteSelector();
      } catch {}
    }

    async function initResidenteSelector() {
      const res = await fetch('/api/residentes');
      const data = await res.json();
      if (!data.ok || data.residentes.length <= 1) return;
      const selector = document.getElementById('residente-selector');
      selector.style.display = 'block';
      document.getElementById('residente-activo-nombre').textContent = activeResidenteNombre;
      const dropdown = document.getElementById('residente-dropdown');
      const opts = [
        `<div class="residente-option ${!activeResidenteId ? 'active' : ''}" onclick="seleccionarResidente(null,'Todos')"><span class="r-dot"></span>Todos</div>`
      ].concat(data.residentes.map(r =>
        `<div class="residente-option ${activeResidenteId == r.id ? 'active' : ''}" onclick="seleccionarResidente(${r.id},'${r.nombre}')"><span class="r-dot"></span>${r.nombre}</div>`
      ));
      dropdown.innerHTML = '<div class="residente-dropdown-header">Ver residente</div>' + opts.join('');
    }

    function toggleResidenteDropdown(e) {
      e.stopPropagation();
      document.getElementById('residente-dropdown').classList.toggle('open');
    }

    function seleccionarResidente(id, nombre) {
      activeResidenteId = id ? String(id) : null;
      activeResidenteNombre = nombre;
      id ? sessionStorage.setItem('activeResidenteId', id) : sessionStorage.removeItem('activeResidenteId');
      sessionStorage.setItem('activeResidenteNombre', nombre);
      document.getElementById('residente-activo-nombre').textContent = nombre;
      document.getElementById('residente-dropdown').classList.remove('open');
      document.querySelectorAll('.residente-tab').forEach(t => {
        t.classList.toggle('active', (t.dataset.rid || '') === (activeResidenteId || ''));
      });
      cargarTickets();
    }

    async function cargarTabs() {
      const res = await fetch('/api/residentes/mis-residentes');
      const data = await res.json();
      if (!data.ok || data.residentes.length <= 1) return;
      const tabsEl = document.getElementById('residente-tabs');
      tabsEl.style.display = 'flex';
      const total = data.residentes.reduce((a, r) => a + Number(r.ticket_count), 0);
      const allTab = `<button class="residente-tab ${!activeResidenteId ? 'active' : ''}" data-rid="" onclick="selectTab(null,'Todos',this)">Todos <span class="tab-badge">${total}</span></button>`;
      const rTabs = data.residentes.map(r =>
        `<button class="residente-tab ${activeResidenteId == r.id ? 'active' : ''}" data-rid="${r.id}" onclick="selectTab(${r.id},'${r.nombre.replace(/'/g,"\\'")}',this)">${r.nombre} <span class="tab-badge">${r.ticket_count}</span></button>`
      );
      tabsEl.innerHTML = [allTab, ...rTabs].join('');
    }

    function selectTab(id, nombre, btn) {
      activeResidenteId = id ? String(id) : null;
      activeResidenteNombre = nombre;
      id ? sessionStorage.setItem('activeResidenteId', id) : sessionStorage.removeItem('activeResidenteId');
      sessionStorage.setItem('activeResidenteNombre', nombre);
      document.querySelectorAll('.residente-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const pill = document.getElementById('residente-activo-nombre');
      if (pill) pill.textContent = nombre;
      cargarTickets();
    }

    document.addEventListener('click', e => {
      const sel = document.getElementById('residente-selector');
      if (sel && !sel.contains(e.target)) document.getElementById('residente-dropdown').classList.remove('open');
    });

    async function cargarTickets() {
      const url = '/api/tickets' + (activeResidenteId ? `?residente_id=${activeResidenteId}` : '');
      const res = await fetch(url);
      const data = await res.json();
      const lista = document.getElementById('lista');

      if (!data.ok || data.tickets.length === 0) {
        lista.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎫</div>
            <div class="empty-title">Sin tickets aún</div>
            <div class="empty-desc">Sube tu primer ticket para comenzar</div>
            <a href="/dashboard" class="btn btn-primary">Subir ticket</a>
          </div>`;
        document.getElementById('tickets-count').textContent = '0 tickets';
        return;
      }

      document.getElementById('tickets-count').textContent = `${data.tickets.length} ticket${data.tickets.length !== 1 ? 's' : ''}`;

      lista.innerHTML = data.tickets.map(t => {
        let datos = {};
        try { datos = JSON.parse(t.ocr_json || '{}'); } catch {}

        const statusMap = {
          pendiente_confirmacion: '<span class="badge" style="background:#FFF7ED;color:#F97316;">Confirmar datos</span>',
          pendiente: '<span class="badge badge-pending">Pendiente</span>',
          procesando: '<span class="badge badge-processing">Procesando</span>',
          procesando_correo: '<span class="badge" style="background:#fff8e6;color:#c97b00;">Procesando</span>',
          procesado: '<span class="badge badge-success">Facturado</span>',
          error: '<span class="badge badge-error">Error</span>',
        };
        const badge = statusMap[t.status] || `<span class="badge badge-pending">${t.status}</span>`;

        const datosStr = datos.fecha
          ? `${datos.fecha}${datos.total ? ' · $' + datos.total : ''}${datos.folio ? ' · Folio ' + datos.folio : ''}`
          : '';

        const isPendingConfirm = t.status === 'pendiente_confirmacion';
        const isError = t.status === 'error';
        const canFacturar = t.status === 'pendiente' || isError;
        const canDelete = isError || t.status === 'pendiente' || isPendingConfirm;
        const btnLabel = t.status === 'procesado' ? 'Facturado' : isError ? 'Reintentar' : 'Facturar';
        const isInactive = ['procesando', 'procesando_correo', 'procesado'].includes(t.status);

        return `
          <div class="ticket-row" id="ticket-${t.id}">
            <div class="ticket-main">
              <div class="ticket-name">${t.comercio || 'Comercio desconocido'}</div>
              <div class="ticket-meta">${t.nombre_archivo} · ${new Date(t.creado).toLocaleDateString('es-MX', {day:'2-digit',month:'short',year:'numeric'})}</div>
              ${datosStr ? `<div class="ticket-datos">${datosStr}</div>` : ''}
              ${isError && t.error_msg ? `<div style="font-size:0.75rem;color:#c0392b;margin-top:3px;">${t.error_msg}</div>` : ''}
            </div>
            <div class="ticket-right">
              ${badge}
              ${isPendingConfirm
                ? `<a href="/dashboard?confirmar=${t.id}" class="btn btn-primary btn-sm">Revisar datos</a>`
                : isInactive
                  ? `<button class="btn btn-primary btn-sm" disabled style="opacity:0.4;cursor:not-allowed;">${btnLabel}</button>`
                  : `<button class="btn btn-primary btn-sm" id="btn-${t.id}" onclick="facturar(${t.id})">${btnLabel}</button>`
              }
              ${isError ? `<button class="btn btn-sm" onclick="abrirEditar(${t.id}, ${JSON.stringify(JSON.stringify(datos))})" style="background:#f0f4ff;color:#3b5bdb;border:1.5px solid #c5d0fa;">Editar datos</button>` : ''}
              ${canDelete ? `<button class="btn btn-sm" id="del-${t.id}" onclick="eliminarTicket(${t.id})" style="background:#fef0ef;color:#c0392b;border:1.5px solid #fad7d5;">Eliminar</button>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    async function facturar(ticketId) {
      const btn = document.getElementById('btn-' + ticketId);
      const alertEl = document.getElementById('alert-factura');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      alertEl.style.display = 'none';

      try {
        const res = await fetch(`/facturar/${ticketId}`, { method: 'POST' });
        const data = await res.json();

        if (data.ok) {
          alertEl.className = 'alert alert-success';
          alertEl.textContent = data.procesando
            ? 'Facturación iniciada en segundo plano. Te avisaremos cuando esté lista.'
            : 'Factura generada. Revisa "Mis Facturas" para descargarla.';
          alertEl.style.display = 'block';
          cargarTickets();
        } else if (data.enCola) {
          alertEl.className = 'alert';
          alertEl.style.background = '#fff8e6';
          alertEl.style.color = '#c97b00';
          alertEl.style.display = 'block';
          alertEl.textContent = data.msg || 'En cola — se procesará automáticamente.';
          btn.disabled = false;
          btn.textContent = 'Reintentar';
          cargarTickets();
        } else {
          alertEl.className = 'alert alert-error';
          alertEl.textContent = 'Error: ' + (data.msg || 'No se pudo generar la factura');
          alertEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Reintentar';
          cargarTickets();
        }
      } catch {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = 'Error de conexión. Intenta de nuevo.';
        alertEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Reintentar';
      }
    }

    async function eliminarTicket(id) {
      if (!confirm('¿Eliminar este ticket? Esta acción no se puede deshacer.')) return;
      const btn = document.getElementById('del-' + id);
      btn.disabled = true;
      btn.textContent = '...';
      const res = await fetch(`/api/tickets/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.ok) {
        document.getElementById('ticket-' + id)?.remove();
      } else {
        alert('Error: ' + data.msg);
        btn.disabled = false;
        btn.textContent = 'Eliminar';
      }
    }

    let editarTicketId = null;

    const CAMPOS_EDITABLES = [
      { key: 'folio',         label: 'Folio / Ticket' },
      { key: 'referencia',    label: 'Referencia' },
      { key: 'idVenta',       label: 'ID de Venta' },
      { key: 'codigoTicket',  label: 'Código de ticket' },
      { key: 'folioFactura',  label: 'Folio de factura' },
      { key: 'total',         label: 'Total ($)' },
      { key: 'fecha',         label: 'Fecha' },
      { key: 'comercio',      label: 'Comercio' },
      { key: 'portalUrl',     label: 'URL del portal' },
    ];

    function abrirEditar(ticketId, datosJson) {
      editarTicketId = ticketId;
      let datos = {};
      try { datos = JSON.parse(datosJson); } catch {}

      const presentes = CAMPOS_EDITABLES.filter(c => datos[c.key] !== undefined && datos[c.key] !== null && datos[c.key] !== '');
      const extras = CAMPOS_EDITABLES.filter(c => !presentes.find(p => p.key === c.key));
      const campos = [...presentes, ...extras.slice(0, 2)]; // mostrar los que tienen valor + 2 vacíos extra

      document.getElementById('modal-fields').innerHTML = campos.map(c => `
        <div class="modal-field">
          <label>${c.label}</label>
          <input id="campo-${c.key}" type="text" value="${datos[c.key] !== undefined ? String(datos[c.key]).replace(/"/g,'&quot;') : ''}">
        </div>`).join('');

      document.getElementById('modal-editar').classList.add('open');
    }

    function cerrarModal() {
      document.getElementById('modal-editar').classList.remove('open');
      editarTicketId = null;
    }

    async function guardarDatos() {
      if (!editarTicketId) return;
      const body = {};
      CAMPOS_EDITABLES.forEach(c => {
        const el = document.getElementById('campo-' + c.key);
        if (el && el.value.trim() !== '') body[c.key] = el.value.trim();
      });

      const res = await fetch(`/api/tickets/${editarTicketId}/datos`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      cerrarModal();

      if (data.ok) {
        // Lanzar reintento automático
        await facturar(editarTicketId);
      } else {
        const alertEl = document.getElementById('alert-factura');
        alertEl.className = 'alert alert-error';
        alertEl.textContent = 'Error al guardar: ' + (data.msg || 'intenta de nuevo');
        alertEl.style.display = 'block';
      }
      cargarTickets();
    }

    document.getElementById('modal-editar').addEventListener('click', e => {
      if (e.target === document.getElementById('modal-editar')) cerrarModal();
    });

    initNav();
    cargarTickets();
    cargarTabs();
    initNotificaciones();
  </script>

    </div>
  </div>

</body>
</html>
