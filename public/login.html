<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Facturas - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0d0d0d; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1a1a1a; padding: 2rem; border-radius: 12px; width: 100%; max-width: 380px; border: 1px solid #333; }
    h2 { color: #7AC142; text-align: center; margin-bottom: 1.5rem; font-size: 24px; }
    input { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #7AC142; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
    button:hover { background: #6ab33a; }
    .toggle { text-align: center; margin-top: 1rem; color: #aaa; font-size: 13px; }
    .toggle span { color: #7AC142; cursor: pointer; }
    .msg { text-align: center; margin-top: 10px; font-size: 13px; color: #ff6b6b; }
    .form { display: none; }
    .form.active { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Portal Facturas</h2>

    <div id="formLogin" class="form active">
      <input type="email" id="loginEmail" placeholder="Correo electrónico">
      <input type="password" id="loginPass" placeholder="Contraseña">
      <button onclick="login()">Entrar</button>
      <div class="toggle">¿No tienes cuenta? <span onclick="toggle()">Regístrate</span></div>
    </div>

    <div id="formRegister" class="form">
      <input type="text" id="regNombre" placeholder="Nombre completo">
      <input type="email" id="regEmail" placeholder="Correo electrónico">
      <input type="password" id="regPass" placeholder="Contraseña">
      <button onclick="register()">Crear cuenta</button>
      <div class="toggle">¿Ya tienes cuenta? <span onclick="toggle()">Inicia sesión</span></div>
    </div>

    <p class="msg" id="msg"></p>
  </div>

  <script>
    function toggle() {
      document.getElementById("formLogin").classList.toggle("active");
      document.getElementById("formRegister").classList.toggle("active");
      document.getElementById("msg").textContent = "";
    }

    async function login() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPass").value;
      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.ok) window.location.href = "/dashboard";
      else document.getElementById("msg").textContent = data.msg;
    }

    async function register() {
      const nombre = document.getElementById("regNombre").value;
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPass").value;
      const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, email, password })
      });
      const data = await res.json();
      if (data.ok) { document.getElementById("msg").style.color = "#7AC142"; document.getElementById("msg").textContent = "Cuenta creada, inicia sesión"; toggle(); }
      else document.getElementById("msg").textContent = data.msg;
    }
  </script>
</body>
</html>
